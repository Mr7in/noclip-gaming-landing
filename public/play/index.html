.sheet .slipbar { background: linear-gradient(transparent, var(--locker) 22%); bottom: calc(-20px - env(safe-area-inset-bottom, 0px)) }
.stakes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
.stakes button { background: var(--locker-2); border: 2px solid var(--seam); border-radius: 10px; padding: 8px 0; font-family: var(--f-num); font-size: 14px; text-align: center }
.stakes button.on { border-color: var(--ball); color: var(--ball) }

/* ======================= LIVE MATCH ======================= */
.live { display: flex; flex-direction: column; gap: 10px; padding-top: 8px }
.board { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; background: #0b0705; border: 1px solid var(--seam); border-radius: 16px; padding: 10px 12px; box-shadow: 0 0 30px #ffd23f14 inset }
.board .tm { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0 }
.board .tm.r { justify-content: flex-end }
.board .tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.score { font-family: var(--f-num); font-size: 40px; color: var(--led); text-shadow: 0 0 16px #ffd23f88; line-height: 1; display: flex; gap: 8px; align-items: center }
.score .sep { color: var(--seam); font-size: 26px }
.score .bump { animation: bump .45s }
@keyframes bump { 40% { transform: scale(1.4); color: #fff } }
.clock { grid-column: 1 / -1; display: flex; justify-content: center; gap: 10px; font-family: var(--f-num); font-size: 12px; color: var(--ball) }
.momentum { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--ball) 50%, var(--chalk) 50%); position: relative; overflow: hidden }
.momentum i { position: absolute; top: -3px; width: 4px; height: 12px; background: #fff; border-radius: 2px; box-shadow: 0 0 8px #fff; transition: left .6s }
.lcourt { position: relative; aspect-ratio: 100 / 132; max-width: 100%; border-radius: 16px; overflow: hidden; background: repeating-linear-gradient(90deg, var(--maple) 0 14px, var(--maple-2) 14px 15px); box-shadow: inset 0 0 50px #000b }
.lcourt::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, #fff2, transparent 65%); mix-blend-mode: overlay; pointer-events: none }
.lcourt svg { position: absolute; inset: 0; width: 100%; height: 100% }
.pdot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-size: 11px; transition: left .5s cubic-bezier(.3,.8,.3,1), top .5s cubic-bezier(.3,.8,.3,1); box-shadow: 0 4px 6px #0007; z-index: 2 }
.pdot.h { background: var(--hc, var(--ball)); color: #fff; border: 2px solid var(--h2, #fff) }
.pdot.a { background: var(--ac, var(--chalk)); color: var(--at, #fff); border: 2px solid #ffffffcc }
.pdot.fire { box-shadow: 0 0 0 3px var(--led), 0 0 22px 8px #ff7a1add; animation: flick .22s infinite alternate }
@keyframes flick { to { box-shadow: 0 0 0 3px var(--ball), 0 0 30px 12px #ffd23fcc } }
.ballx { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; z-index: 4; transition: left .35s ease-out, top .35s ease-out }
.ballx i { display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffb27a, var(--ball) 55%, #b44d06); box-shadow: 0 0 10px #ff7a1a99 }
.shadow { position: absolute; width: 14px; height: 6px; margin: -3px 0 0 -7px; border-radius: 50%; background: #0006; z-index: 1; transition: left .35s ease-out, top .35s ease-out }
.float { position: absolute; z-index: 6; font-family: var(--f-num); font-size: 24px; color: var(--led); text-shadow: 0 2px 0 #000a; pointer-events: none; animation: floatup 1s ease-out forwards }
@keyframes floatup { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0 } 20% { transform: translate(-50%, -10px) scale(1.3); opacity: 1 } 100% { transform: translate(-50%, -50px) scale(1); opacity: 0 } }
.callout { position: absolute; left: 50%; top: 46%; z-index: 7; font-family: var(--f-num); font-size: 46px; line-height: 1; color: #fff; pointer-events: none; white-space: nowrap; -webkit-text-stroke: 2px #2b1203; text-shadow: 0 6px 0 #2b1203, 0 0 30px var(--ball); animation: callout 1.1s cubic-bezier(.3,1.5,.5,1) forwards }
@keyframes callout { 0% { transform: translate(-50%, -50%) scale(2.6) rotate(-8deg); opacity: 0 } 25% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1 } 75% { opacity: 1 } 100% { transform: translate(-50%, -80%) scale(1.05) rotate(-4deg); opacity: 0 } }
.rim-flash { animation: rim .5s }
@keyframes rim { 50% { stroke: var(--led); stroke-width: 2.4 } }
.controls { display: flex; gap: 6px; align-items: center }
.controls button { background: var(--locker); border: 1px solid var(--seam); border-radius: 10px; padding: 7px 12px; font-family: var(--f-num); font-size: 12px }
.controls button.on { border-color: var(--ball); color: var(--ball) }
.ticker { display: flex; flex-direction: column; gap: 4px; min-height: 120px }
.tk { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--locker); animation: tkin .3s ease-out }
.tk .c { color: var(--faint); font-size: 11px; font-family: var(--f-num); white-space: nowrap }
.tk .s { color: var(--dim); font-family: var(--f-num); font-size: 11px; white-space: nowrap }
.tk.h { border-left: 3px solid var(--ball) } .tk.a { border-left: 3px solid var(--chalk) }
.tk.big { background: #ff7a1a26 }
@keyframes tkin { from { transform: translateX(-10px); opacity: 0 } }
.mybets { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none }
.mb { flex: none; background: var(--locker); border: 1px dashed var(--seam); border-radius: 10px; padding: 6px 9px; font-size: 11.5px; white-space: nowrap }
.mb b { color: var(--ball); font-family: var(--f-num); font-weight: 400 }
.box { width: 100%; border-collapse: collapse; font-size: 12.5px }
.box th, .box td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--seam) }
.box th:first-child, .box td:first-child { text-align: left }
.box th { color: var(--dim); font-weight: 600 }
details > summary { list-style: none; cursor: pointer }
details > summary::-webkit-details-marker { display: none }

/* bet tracker */
.tracker { display: flex; flex-direction: column; gap: 6px }
.tb { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; background: var(--locker); border: 1px solid var(--seam); border-radius: 12px; padding: 8px 10px; overflow: hidden; transition: border-color .3s, background .3s }
.tb .l { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tb .r { font-family: var(--f-num); font-size: 13px; text-align: right; white-space: nowrap }
.tb .meta { font-size: 11px; color: var(--dim) }
.tb .pct { font-family: var(--f-num); font-size: 15px; text-align: right; transition: color .3s }
.tb .meter { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--locker-2); overflow: hidden; display: block }
.tb .meter i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--ball), var(--led)); transition: width .6s cubic-bezier(.3,.9,.3,1) }
.tb.good { border-color: #3ddc8466 } .tb.good .meter i { background: linear-gradient(90deg, #22a35a, var(--win)) } .tb.good .pct { color: var(--win) }
.tb.won { border-color: var(--win); background: linear-gradient(90deg, #3ddc8422, var(--locker)) } .tb.won .meter i { background: var(--win) }
.tb.lost { opacity: .5 } .tb.cashed { opacity: .7; border-style: dashed }
.tb .bp { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 1px }
.bp.g { background: #3ddc8433; color: var(--win) } .bp.w { background: var(--win); color: #052 } .bp.n { background: var(--locker-2); color: var(--dim) }
.tb.flash { animation: tbflash .8s }
@keyframes tbflash { 30% { box-shadow: 0 0 0 2px var(--win), 0 0 24px #3ddc8488 } }
.cash-btn { grid-column: 1 / -1; margin-top: 4px; background: var(--locker-2); border: 1px solid var(--led); color: var(--led); border-radius: 10px; padding: 8px; font-weight: 700; font-size: 13px; text-align: center }
.insight { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; background: linear-gradient(90deg, #ff7a1a1a, var(--locker-2)); border: 1px solid var(--seam); border-radius: 14px; padding: 10px }
.insight .ic { width: 36px; height: 36px; border-radius: 10px; background: #ff7a1a26; color: var(--ball); display: grid; place-items: center; font-family: var(--f-num); font-size: 14px }
.insight p { margin: 0 0 6px; font-size: 13px }
.insight .sel { padding: 8px 10px }

/* AI + projections + explainers */
.ai-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 15px; color: #fff; text-align: center;
  background: linear-gradient(110deg, #6d28d9, #c026d3 40%, #ff7a1a 70%, #6d28d9); background-size: 250% 100%; animation: aigrad 5s linear infinite; box-shadow: 0 4px 0 #3b0f6b, 0 10px 24px #a855f744; transition: transform .08s }
.ai-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3b0f6b }
.ai-btn:disabled { filter: saturate(.4); cursor: wait }
.ai-btn svg { width: 20px; height: 20px; flex: none }
@keyframes aigrad { to { background-position: 250% 0 } }
.slot.swapin .tc { animation: swapin .8s cubic-bezier(.3,1.5,.5,1) both }
@keyframes swapin { 0% { transform: rotateY(90deg) scale(.4); opacity: 0 } 60% { transform: rotateY(-10deg) scale(1.08); opacity: 1 } }
.proj { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: #0b0705; border: 1px solid var(--seam); border-radius: 16px; padding: 10px 14px }
.proj .k { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.proj .k span { font-size: 11px; color: var(--dim); white-space: nowrap }
.proj .k b { font-family: var(--f-num); font-weight: 400; font-size: 26px; color: var(--led); line-height: 1; text-shadow: 0 0 12px #ffd23f55 }
.proj .k.r { align-items: flex-end; text-align: right }
.proj .k.r b { font-size: 16px; color: var(--chalk); text-shadow: none }
.proj .bar2 { height: 10px; border-radius: 6px; background: var(--locker-2); position: relative; overflow: hidden }
.proj .bar2 i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--ball), var(--led)); border-radius: 6px; transition: width .7s cubic-bezier(.3,1.3,.5,1) }
.proj .bar2 em { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #ffffff70 }
.proj .chg { grid-column: 1 / -1; font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px }
.chg .up { color: var(--win); font-weight: 700 } .chg .dn { color: var(--loss); font-weight: 700 }
.dl { font-family: var(--f-num); font-size: 11px; padding: 2px 6px; border-radius: 6px; white-space: nowrap; line-height: 1.3 }
.dl.up { background: #16a34a; color: #fff } .dl.dn { background: #dc2626; color: #fff } .dl.eq { background: #d9d3c4; color: #4b4537 } .dl.wait { background: #e9e4d8; color: #a39b8a } .dl.best { background: #eab308; color: #2b2400 }
.play .foot { display: flex; justify-content: space-between; align-items: center; gap: 4px }
.play .what { font-family: var(--f-ui); font-size: 10.5px; font-weight: 600; color: #57534e; line-height: 1.2 }
.token .dl { margin-top: 2px }
.stat-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 36px; gap: 10px; align-items: center }
.stat-row .si { width: 30px; height: 30px; border-radius: 9px; background: #ff7a1a22; color: var(--ball); display: grid; place-items: center }
.stat-row .si svg { width: 18px; height: 18px }
.stat-row b { font-size: 14px } .stat-row p { margin: 1px 0 0; font-size: 12px; color: var(--dim); line-height: 1.3 }
.stat-row .v { font-family: var(--f-num); font-size: 18px; color: var(--led); text-align: right }
.upg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: linear-gradient(90deg, #e046ff1a, var(--locker-2)); border: 1px solid #e046ff44; border-radius: 14px; padding: 12px }
.upg .lvbar { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px }
.upg .lvbar i { height: 6px; border-radius: 3px; background: var(--seam) } .upg .lvbar i.f { background: linear-gradient(90deg, #a855f7, var(--epic)) }
.info { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--dim); color: var(--dim); font-weight: 800; font-size: 12px; display: inline-grid; place-items: center; flex: none }
.legend-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); align-items: center }
.legend-row svg { vertical-align: middle; margin-right: 4px }
.guide { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; background: radial-gradient(circle at 50% 0%, #3a2416, #0b0705 70%) }
.gwrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; z-index: 2; padding-bottom: 10px }
.gtop { display: flex; justify-content: space-between; align-items: center }
.gbody { display: flex; flex-direction: column; gap: 12px }
.gdots { display: flex; gap: 6px; justify-content: center }
.gdots i { width: 8px; height: 8px; border-radius: 4px; background: var(--seam); transition: width .3s } .gdots i.on { width: 22px; background: var(--ball) }
.gcard { display: grid; grid-template-columns: 42% minmax(0, 1fr); gap: 14px; align-items: center }
.callouts { display: flex; flex-direction: column; gap: 9px; font-size: 13px }
.callouts div { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: center }
.callouts .tg { font-family: var(--f-num); font-size: 12px; color: var(--ball-ink); background: var(--ball); border-radius: 6px; padding: 2px 0; text-align: center }
.formula { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 6px; align-items: center; text-align: center }
.formula > div { background: var(--locker-2); border-radius: 12px; padding: 10px 4px; display: flex; flex-direction: column; gap: 2px }
.formula b { font-family: var(--f-num); font-weight: 400; font-size: 22px; color: var(--led) }
.formula span { font-size: 11px; color: var(--dim) } .formula .op { font-family: var(--f-num); font-size: 18px; color: var(--dim); background: none; padding: 0 }
.formula .eq { background: #ff7a1a26; box-shadow: inset 0 0 0 1px var(--ball) }
.steps { display: flex; flex-direction: column; gap: 10px }
.steps > div { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px }
.steps .no { width: 30px; height: 30px; border-radius: 50%; background: var(--ball); color: var(--ball-ink); font-family: var(--f-num); display: grid; place-items: center }
.vsm { display: grid; grid-template-columns: 1fr 36px 1fr; align-items: center; gap: 6px }
.howto { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100% }
.howto .q { width: 44px; height: 44px; border-radius: 12px; background: #ff7a1a26; color: var(--ball); font-family: var(--f-num); font-size: 22px; display: grid; place-items: center }

/* live court motion */
.lcourt .pdot { left: 0; top: 0; transition: box-shadow .2s; will-change: transform }
.lcourt .ballx, .lcourt .shadow { left: 0; top: 0; transition: none; will-change: transform }
.lcourt.shake { animation: cshake .3s }
@keyframes cshake { 25% { transform: translate(-3px, 2px) } 50% { transform: translate(3px, -2px) } 75% { transform: translate(-2px, 1px) } }
.pdot.foul { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--loss) }
.ref-pill { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 8; background: #111; color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 800; white-space: nowrap; box-shadow: 0 4px 10px #0008; animation: refin .25s ease-out; background-image: repeating-linear-gradient(90deg, #111 0 10px, #2a2a2a 10px 20px) }
@keyframes refin { from { transform: translate(-50%, -12px); opacity: 0 } }
.tfrow { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11px; color: var(--dim) }
.tfrow .bonus { color: var(--loss); font-weight: 800 }

/* result */
.result { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; padding-top: 20px }
.verdict { font-family: var(--f-num); font-size: 50px; line-height: .95; animation: callin .6s cubic-bezier(.3,1.6,.5,1) }
.verdict.w { color: var(--win); text-shadow: 0 0 26px #3ddc8488 }
.rewards { display: none }
.rw { background: var(--locker); border: 1px solid var(--seam); border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 90px; animation: popin .5s cubic-bezier(.3,1.6,.5,1) both }
.rw .n { color: var(--led); font-size: 20px }
.rw span { font-size: 11px; color: var(--dim) }
.money { width: 100%; text-align: left }
.money .line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 4px 0 }
.money .net { border-top: 1px solid var(--seam); margin-top: 4px; padding-top: 8px; font-weight: 700 }

/* store */
.bundles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.bundle { position: relative; background: linear-gradient(170deg, var(--locker-2), var(--locker)); border: 2px solid var(--seam); border-radius: 16px; padding: 14px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; overflow: hidden }
.bundle .stackc { height: 46px; display: flex; align-items: flex-end; justify-content: center }
.bundle .stackc svg { width: 30px; height: 30px; margin: 0 -6px }
.bundle .n { font-size: 21px; color: var(--led) }
.bundle .eur { background: var(--ball); color: var(--ball-ink); border-radius: 10px; padding: 7px 10px; font-weight: 800; font-size: 14px; width: 100% }
.bundle .bonus { position: absolute; top: 8px; right: 8px; background: var(--win); color: #052; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 7px }
.bundle.best { border-color: var(--led); box-shadow: 0 0 22px #ffd23f33 }
.offer { position: relative; overflow: hidden; border-radius: 20px; padding: 16px; background: radial-gradient(circle at 100% 0%, #ffc53355, transparent 60%), linear-gradient(150deg, #3a2416, var(--locker)); border: 1px solid #ffc53366; display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: center }
.offer .fan { position: relative; height: 120px }
.offer .fan > div { position: absolute; width: 64px; left: 16px; top: 4px; transform-origin: 50% 110% }
.cosm { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.ci { background: var(--locker-2); border: 2px solid var(--seam); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; text-align: center }

/* ranks */
.seg { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--locker); border-radius: 12px; padding: 4px; gap: 4px }
.seg button { padding: 9px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--dim); text-align: center }
.seg button.on { background: var(--locker-2); color: var(--chalk) }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 8px; padding-top: 10px }
.podium > div { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0 }
.podium .blk { width: 100%; border-radius: 10px 10px 4px 4px; display: grid; place-items: center; font-family: var(--f-num); font-size: 22px; color: var(--ball-ink) }
.podium b { font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.rk { display: grid; grid-template-columns: 24px 28px minmax(0, 1fr) auto 36px; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 13.5px }
.rk:nth-child(odd) { background: #ffffff05 }
.rk .pos { font-family: var(--f-num); font-size: 13px; color: var(--dim) }
.rk.me { background: #ff7a1a26; box-shadow: inset 0 0 0 1px var(--ball) }
.rk.up .pos { color: var(--win) } .rk.down .pos { color: var(--loss) }
.rk .pts { font-family: var(--f-num); font-size: 13px; color: var(--led); text-align: right }
.rk .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.zone { font-size: 11px; font-weight: 700; padding: 6px 10px 2px; color: var(--dim) }

/* identity */
.swatches { display: flex; gap: 8px; flex-wrap: wrap }
.sw-c { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent }
.sw-c.on { border-color: var(--chalk) }
input.txt { width: 100%; background: var(--locker-2); border: 1px solid var(--seam); color: var(--chalk); border-radius: 12px; padding: 12px; font: inherit; font-weight: 700 }

/* fx */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80 }
.flycoin { position: fixed; left: 0; top: 0; z-index: 81; width: 18px; height: 18px; pointer-events: none }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%); z-index: 90; background: var(--chalk); color: var(--oak); font-weight: 700; border-radius: 12px; padding: 10px 16px; font-size: 14px; box-shadow: 0 10px 30px #000a; animation: toast 2.4s forwards; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis }

    <span><b>${b.n} odds · Division ${S.division}</b>${b.rtp ? ` <span class="tag" style="background:var(--win);color:#062b16">+${pctPt(b.rtp)} returns</span>` : ""}

  // 2. a clear upgrade at your weakest starting position

  { const b0 = better[Math.floor(r() * Math.min(4, better.length))]; if (b0) take(b0, `Upgrade at ${POS[wi]}: +${Math.round(wOvr(b0.a, b0.pos)) - ovr(st[wi])} OVR`) }

    `);
}
const SH_DUP = { common: 10, rare: 25, epic: 60, legendary: 150 }, SH_REC = { common: 5, rare: 15, epic: 40, legendary: 100 }, SH_WIN = 8, SH_LOSS = 3;
const upCost = c => c.lvl * 20;
function dupCards() {
  const keep = new Set([...S.starters, ...S.bench]), groups = {};
  for (const c of S.cards) (groups[c.key || c.name] = groups[c.key || c.name] || []).push(c);
  const out = [];
  for (const g of Object.values(groups)) { if (g.length < 2) continue; const best = g.find(c => keep.has(c.id)) || g.slice().sort((a, b) => b.lvl - a.lvl || ovr(b) - ovr(a))[0]; g.forEach(c => { if (c !== best && !keep.has(c.id)) out.push(c) }) }
  return out;
}
let RECY = { dup: true, common: false, rare: false };
function recyclables() {
  const d = dupCards(), ds = new Set(d.map(c => c.id)), spare = S.cards.filter(c => !S.starters.includes(c.id) && !S.bench.includes(c.id) && !ds.has(c.id));
  const groups = { dup: d, common: spare.filter(c => c.rarity === "common"), rare: spare.filter(c => c.rarity === "rare") };
  const val = (k, c) => k === "dup" ? SH_DUP[c.rarity] : SH_REC[c.rarity];
  const pick = Object.entries(groups).filter(([k]) => RECY[k]).flatMap(([k, a]) => a.map(c => ({ c, v: val(k, c) })));
  return { groups, pick, total: pick.reduce((a, x) => a + x.v, 0), val };
}
const spareCards = () => S.cards.filter(c => !S.starters.includes(c.id) && !S.bench.includes(c.id) && (c.rarity === "common" || c.rarity === "rare"));

    { t: "Game plan: tactics and boosters", h: `<div class="proj"><div class="k"><span>Win chance</span><b>${pct(pj.win)}</b></div><div class="bar2"><em></em><i style="width:${pj.win * 100}%"></i></div><div class="k r"><span>Projected</span><b>${Math.round(pj.me)} – ${Math.round(pj.opp)}</b></div></div>
        <div class="steps"><div><span class="no">A</span><span><b>Attack plays</b> change your shots: more threes, more inside, more passing or a slower game.</span></div>
        <div><span class="no">D</span><span><b>Defence plays</b> change what the other team gets: zone stops inside shots, the press forces steals.</span></div>
        <div><span class="no" style="background:#16a34a;color:#fff">●</span><span><b>Fit dots</b>: three green dots mean your players suit the play. A good fit makes it work better.</span></div>
        <div><span class="no" style="background:#2563eb;color:#fff">★</span><span><b>Boosters</b> lift your team for one match. Use up to 2.</span></div></div>
        <p class="muted">Every option shows the win chance you would get, from 400 simulated games. Gold badge = best choice. Or tap <b>AI coach</b> to pick for you.</p>` },
    { t: "Play, and bet if you want", h: `<div class="steps"><div><span class="no">1</span><span>Every match earns coins and XP, and wins move you up the division ladder. No bet needed.</span></div>
        <div><span class="no">2</span><span>Bets are optional, before tip-off and at each quarter break. Your live bets show their chance of landing as the game plays.</span></div>
        <div><span class="no">3</span><span>Odds always include both teams, tactics and boosters. A stronger team wins more often, so its odds are shorter. The return rate stays the same: 94% on winner bets, less on longer-odds markets.</span></div>
        <div><span class="no">4</span><span>Changing your game plan at a break settles your open bets at cash-out value first, because they were priced for the old plan.</span></div></div>` },
  ];
}
function openGuide(i = 0, after) {
  let gi = i; const slides = guideSlides(), st = document.createElement("div"); st.className = "stage guide"; document.body.appendChild(st);
  const close = () => { st.remove(); S.seenGuide = 1; save(); after && after() };
  const draw = () => {
    const sl = slides[gi], lastS = gi === slides.length - 1;
    st.innerHTML = `<div class="gwrap"><div class="gtop"><span class="tag">How to play · ${gi + 1} of ${slides.length}</span><button class="link" id="gx">Close</button></div>
      <h1>${sl.t}</h1><div class="gbody enter">${sl.h}</div>
      <div class="gdots">${slides.map((_, k) => `<i class="${k === gi ? "on" : ""}"></i>`).join("")}</div>
      <div class="row"><button class="btn2" id="gp" style="flex:1" ${gi ? "" : "disabled"}>Back</button><button class="cta" id="gn" style="flex:2;font-size:16px;padding:13px">${lastS ? "Let's play" : "Next"}</button></div></div>`;
    bindHolo(st); st.scrollTop = 0;
    st.querySelector("#gx").onclick = close;
    st.querySelector("#gp").onclick = () => { if (gi) { gi--; sfx.flip(); draw() } };
    st.querySelector("#gn").onclick = () => { if (lastS) { sfx.whistle(); close() } else { gi++; sfx.flip(); draw() } };
  };
  let x0 = null;
  st.addEventListener("pointerdown", e => x0 = e.clientX);
  st.addEventListener("pointerup", e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 60) { if (dx < 0 && gi < slides.length - 1) gi++; else if (dx > 0 && gi) gi--; else return; sfx.flip(); draw() } });
  draw();
}

{ const t = new Date().toISOString().slice(0, 10); if (t > S.today) S.today = t; save() }
render();
if (S.boosters.team !== undefined || S.boosters.fast !== undefined) { S.boosters = { crowd: S.boosters.team || 0, hot: S.boosters.hot || 0, lock: 0, boards: 0, floor: 0, run: S.boosters.fast || 0 }; save() }
Object.keys(BOOST).forEach(k => { if (S.boosters[k] == null) S.boosters[k] = 0 });
{ const v = lsGet("backcourt-sound"); S.sound = v == null ? true : v === "1"; renderHUD() }
let STREAK_ASKED = false;
if (!S.played) quickMatch();
else setTimeout(() => { STREAK_ASKED = true; if (streakState().claimable) openStreakSheet() }, 700);
