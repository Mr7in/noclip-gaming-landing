<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Backcourt Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1b130e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800;900&family=Permanent+Marker&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: phone-column game app. Sticky HUD on top, screens in one column, tab bar in the thumb zone. Single dark "locker room" look by choice. */
:root {
  color-scheme: dark;
  --oak: #1b130e; --locker: #2a1e16; --locker-2: #36271c; --seam: #4a3727;
  --maple: #d9a066; --maple-2: #c88e55;
  --ball: #ff7a1a; --ball-ink: #2b1203;
  --chalk: #f4ecdf; --dim: #b8a690; --faint: #8a7764;
  --led: #ffd23f;
  --common: #a9b4c2; --rare: #3d7bff; --epic: #e046ff; --legend: #ffc533;
  --win: #3ddc84; --loss: #ff5a5a;
  --paper: #f8f4e8; --marker-b: #1d4ed8; --marker-r: #d72638; --board: #8a5a35;
  --f-num: "Bungee", "Impact", "Arial Black", sans-serif;
  --f-ui: "Rubik", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Permanent Marker", "Comic Sans MS", cursive;
  --f-note: "Caveat", "Comic Sans MS", cursive;
  --tab-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { height: 100% }
body { margin: 0; background: var(--oak); color: var(--chalk); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; overflow-x: hidden;
  background-image: repeating-linear-gradient(90deg, #ffffff05 0 2px, transparent 2px 46px), radial-gradient(ellipse at 50% -10%, #ff7a1a26, transparent 60%) }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; text-align: inherit }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--led); outline-offset: 2px }
.n { font-family: var(--f-num); font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: .5px }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; position: relative; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--tab-h) + 24px + env(safe-area-inset-bottom, 0px)) }
.screen { display: flex; flex-direction: column; gap: 16px; padding-top: 4px; min-width: 0 }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0 }
h1, h2, h3 { margin: 0; font-weight: 800; line-height: 1.1; text-wrap: balance }
h1 { font-size: 26px } h2 { font-size: 19px } h3 { font-size: 15px }
.muted { color: var(--dim); font-size: 13px; margin: 0 }
.row { display: flex; gap: 10px; align-items: center; min-width: 0 }
.between { justify-content: space-between }
.panel { background: var(--locker); border: 1px solid var(--seam); border-radius: 16px; padding: 14px }
.tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--locker-2); color: var(--dim); white-space: nowrap }
.press { transition: transform .1s }
.press:active { transform: scale(.96) }

/* HUD */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--oak) }
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; padding-block: 10px; background: linear-gradient(var(--oak) 72%, transparent) }
.lvl { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; position: relative; flex: none }
.lvl svg { position: absolute; inset: 0; transform: rotate(-90deg) }
.lvl b { font-family: var(--f-num); font-size: 15px; font-weight: 400 }
.pill { display: flex; align-items: center; gap: 6px; background: var(--locker); border: 1px solid var(--seam); border-radius: 999px; padding: 5px 10px 5px 6px; font-size: 13px; min-width: 0 }
.pill .n { font-size: 13px; color: var(--led) }
.ico { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: middle }
.grow { flex: 1 }
.cash { flex-direction: column; align-items: flex-end; gap: 0; padding: 4px 10px; border-radius: 10px }
.cash small { font-size: 10px; color: var(--dim) }
.cash .n { color: var(--chalk); font-size: 13px }
.snd { width: 34px; height: 34px; border-radius: 50%; background: var(--locker); border: 1px solid var(--seam); display: grid; place-items: center; flex: none }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #140e0af0; backdrop-filter: blur(10px); border-top: 1px solid var(--seam);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)) }
.tabs nav { max-width: 440px; margin: 0 auto; height: var(--tab-h); display: grid; grid-template-columns: repeat(5, 1fr) }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--faint); position: relative }
.tab svg { width: 24px; height: 24px }
.tab.on { color: var(--chalk) }
.tab.on svg { color: var(--ball); filter: drop-shadow(0 0 6px #ff7a1a88) }
.tab.on::after { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--ball) }
.tab .dot { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--ball); color: var(--ball-ink); font-size: 10px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; animation: pulse 1.6s infinite }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px #ff7a1a00 } 0% { box-shadow: 0 0 0 0 #ff7a1a99 } }

/* buttons */
.cta { width: 100%; background: linear-gradient(180deg, #ff9442, var(--ball)); color: var(--ball-ink); border-radius: 14px; padding: 16px; font-family: var(--f-num); font-size: 19px; text-align: center; box-shadow: 0 5px 0 #b44d06, 0 12px 26px #ff7a1a44; transition: transform .08s, box-shadow .08s; position: relative; overflow: hidden }
.cta:active { transform: translateY(4px); box-shadow: 0 1px 0 #b44d06 }
.cta:disabled { filter: grayscale(.8) brightness(.7); cursor: not-allowed }
.cta.shine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, #fff8 50%, transparent 70%); transform: translateX(-100%); animation: shine 2.8s ease-in-out infinite }
@keyframes shine { 60%, 100% { transform: translateX(100%) } }
.btn2 { background: var(--locker-2); border: 1px solid var(--seam); border-radius: 12px; padding: 11px 14px; font-weight: 600; text-align: center; transition: transform .08s }
.btn2:active { transform: scale(.96) }
.btn2:disabled { opacity: .45 }
.link { color: var(--dim); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px; align-self: center; font-size: 13px }

/* ======================= TRADING CARD ======================= */
.tc { --rc: var(--common); --mx: 50%; --my: 50%; --foil: linear-gradient(135deg, #e8edf3, #8c97a6 30%, #f4f7fa 50%, #7d8896 70%, #dfe5ec);
  position: relative; width: 100%; aspect-ratio: 5 / 7; max-width: 100%; border-radius: 6%/4.3%; container-type: inline-size; isolation: isolate; transform-style: preserve-3d; text-align: left }
.tc.rare { --rc: var(--rare); --foil: linear-gradient(135deg, #a9c4ff, #2953c7 30%, #d7e4ff 50%, #1d3f9e 70%, #8fb0ff) }
.tc.epic { --rc: var(--epic); --foil: linear-gradient(135deg, #f6b6ff, #8a1fb0 25%, #ffd6ff 45%, #36c8ff 60%, #a52bd1 80%, #ffc6ff) }
.tc.legendary { --rc: var(--legend); --foil: linear-gradient(135deg, #fff1b8, #b8860b 25%, #fff7d6 45%, #d49b12 65%, #fff0a8 85%, #9b6c08) }
.tc-frame { position: absolute; inset: 0; border-radius: inherit; background: var(--foil); box-shadow: 0 2cqw 5cqw #0009, inset 0 0 0 .6cqw #ffffff66 }
.tc-in { position: absolute; inset: 3.4cqw; border-radius: 3.5cqw; overflow: hidden; background: #120c08 }
.tc-art { position: absolute; inset: 0 }
.tc-art svg { width: 100%; height: 100%; display: block }
.tc-ovr { position: absolute; left: 3cqw; top: 2.5cqw; display: flex; flex-direction: column; align-items: center; line-height: .85; z-index: 2 }
.tc-ovr b { font-family: var(--f-num); font-weight: 400; font-size: 17cqw; color: #fff; text-shadow: 0 .8cqw 0 #000a, 0 0 4cqw #0008 }
.tc-ovr span { font-weight: 900; font-size: 6.5cqw; color: #fff; background: #0008; border-radius: 1.5cqw; padding: .4cqw 1.6cqw; margin-top: 1cqw }
.tc-crest { position: absolute; right: 3cqw; top: 3cqw; width: 16cqw; z-index: 2; filter: drop-shadow(0 .6cqw 1cqw #0009) }
.tc-serial { position: absolute; right: 3.5cqw; top: 21cqw; font-weight: 800; font-size: 4.6cqw; color: #fff; background: #000a; padding: .4cqw 1.4cqw; border-radius: 1.4cqw; z-index: 2; white-space: nowrap }
.tc-plate { position: absolute; left: 0; right: 0; bottom: 0; padding: 3cqw 4cqw 2.6cqw; background: linear-gradient(180deg, transparent, #000d 28%); z-index: 2 }
.tc-first { font-size: 5.4cqw; font-weight: 600; color: #ffffffcc; line-height: 1; text-transform: uppercase; letter-spacing: .3cqw }
.tc-last { font-family: var(--f-num); font-size: 9.5cqw; line-height: 1.05; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase }
.tc-bar { height: .9cqw; margin: 1.6cqw 0; background: var(--foil); border-radius: 1cqw }
.tc-stats { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center }
.tc-stats div { display: flex; flex-direction: column; line-height: 1 }
.tc-stats b { font-family: var(--f-num); font-weight: 400; font-size: 7.4cqw; color: #fff }
.tc-stats span { font-size: 4.2cqw; font-weight: 700; color: #ffffffa8; margin-top: .6cqw }
.tc-flag { position: absolute; left: 4cqw; top: 33cqw; width: 14cqw; border-radius: 1.2cqw; outline: .5cqw solid #ffffff99; overflow: hidden; z-index: 2; box-shadow: 0 .5cqw 1cqw #0008; display: block }
.tc-lv { position: absolute; left: 4cqw; top: 44cqw; font-family: var(--f-num); font-size: 5cqw; color: var(--led); z-index: 2; text-shadow: 0 .5cqw 0 #000 }
.tc-holo { position: absolute; inset: 0; border-radius: inherit; z-index: 3; pointer-events: none; opacity: 0; mix-blend-mode: color-dodge;
  background: repeating-linear-gradient(115deg, #ff008055 0%, #ffb30055 6%, #00ff9555 12%, #00b7ff55 18%, #a100ff55 24%, #ff008055 30%) var(--mx) var(--my) / 220% 220%;
  -webkit-mask-image: radial-gradient(circle at var(--mx) var(--my), #000 0, #0009 55%, #0003 100%); mask-image: radial-gradient(circle at var(--mx) var(--my), #000 0, #0009 55%, #0003 100%) }
.tc-glare { position: absolute; inset: 0; border-radius: inherit; z-index: 4; pointer-events: none; mix-blend-mode: overlay; background: radial-gradient(circle at var(--mx) var(--my), #ffffffcc 0, #ffffff22 25%, transparent 55%) }
.tc.rare .tc-holo { opacity: .35 }
.tc.epic .tc-holo { opacity: .7 }
.tc.legendary .tc-holo { opacity: .85; background: radial-gradient(circle at 20% 30%, #fff 0 .5%, transparent 1%) 0 0 / 9cqw 9cqw, repeating-linear-gradient(115deg, #ffd70066 0%, #fff6 5%, #ff8c0066 10%, #fff3b066 15%, #ffd70066 20%) var(--mx) var(--my) / 220% 220% }
.tc.epic, .tc.legendary { animation: drift 6s ease-in-out infinite alternate }
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg }
/* common: matte slate, muted kit */
.tc.common { --foil: linear-gradient(160deg, #7b8492, #4b5563 55%, #343b46) }
.tc.common .tc-frame { box-shadow: 0 2cqw 5cqw #0009, inset 0 0 0 .5cqw #ffffff22 }
.tc.common .tc-art svg { filter: saturate(.45) brightness(.82) }
.tc.common .tc-glare { opacity: .35 }
/* rare: blue chrome with a moving sheen */
.tc.rare .tc-frame { box-shadow: 0 2cqw 5cqw #0009, 0 0 4cqw #3d7bff66, inset 0 0 0 .6cqw #ffffff66; overflow: hidden }
.tc.rare .tc-frame::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(110deg, transparent 35%, #ffffffb0 48%, transparent 60%) -150% 0 / 250% 100% no-repeat; animation: sheen 3.2s ease-in-out infinite }
/* epic: rotating prismatic frame, rays, sparkles */
.tc.epic .tc-frame { background: conic-gradient(from var(--ang), #f0abfc, #7c3aed, #22d3ee, #f472b6, #a855f7, #f0abfc); animation: ang 4s linear infinite; box-shadow: 0 2cqw 5cqw #0009, 0 0 6cqw #e046ffaa }
/* legendary: rotating gold, starburst, gold glow pulse */
.tc.legendary .tc-frame { background: conic-gradient(from var(--ang), #fff7cc, #b8860b, #ffe066, #8a5a00, #fff2a8, #d4a017, #fff7cc); animation: ang 3s linear infinite, lglow 1.6s ease-in-out infinite alternate }
@keyframes ang { to { --ang: 360deg } }
@keyframes lglow { from { box-shadow: 0 2cqw 5cqw #0009, 0 0 6cqw #ffc53388 } to { box-shadow: 0 2cqw 5cqw #0009, 0 0 12cqw #ffc533ee } }
.tc-rays { position: absolute; inset: -30%; z-index: 1; pointer-events: none; mix-blend-mode: screen; opacity: .5; animation: rot 18s linear infinite;
  background: repeating-conic-gradient(from 0deg at 50% 45%, var(--ray) 0 7deg, transparent 7deg 20deg); -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0, transparent 60%); mask-image: radial-gradient(circle at 50% 45%, #000 0, transparent 60%) }
.tc.epic .tc-rays { --ray: #e046ff66 } .tc.legendary .tc-rays { --ray: #ffd54a99; opacity: .8 }
.tc-sp { position: absolute; z-index: 5; width: 7cqw; height: 7cqw; pointer-events: none; background: radial-gradient(circle, #fff 0 12%, transparent 13%), conic-gradient(from 45deg, transparent 0 20%, #fff 20% 30%, transparent 30% 45%, #fff 45% 55%, transparent 55% 70%, #fff 70% 80%, transparent 80%);
  -webkit-mask-image: radial-gradient(circle, #000 0 35%, transparent 70%); mask-image: radial-gradient(circle, #000 0 35%, transparent 70%); animation: twinkle 1.8s ease-in-out infinite; opacity: 0 }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0) } 50% { opacity: 1; transform: scale(1) rotate(45deg) } }
.tc-tier { position: absolute; left: 50%; bottom: -1.2cqw; transform: translateX(-50%); z-index: 6; font-family: var(--f-num); font-size: 5.6cqw; line-height: 1; padding: 1.2cqw 3.4cqw; border-radius: 2cqw; white-space: nowrap; letter-spacing: .3cqw; box-shadow: 0 1cqw 2cqw #0009 }
.tc.common .tc-tier { background: #4b5563; color: #e5e7eb }
.tc.rare .tc-tier { background: linear-gradient(180deg, #6ea0ff, #1d4ed8); color: #fff }
.tc.epic .tc-tier { background: linear-gradient(90deg, #c026d3, #7c3aed, #0891b2); color: #fff }
.tc.legendary .tc-tier { background: linear-gradient(180deg, #fff1a8, #e0a800 55%, #a87400); color: #3a2600; overflow: hidden }
.tc.legendary .tc-tier::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, #fff 50%, transparent 70%) -150% 0 / 250% 100% no-repeat; animation: sheen 2.4s infinite }
.tc.legendary .tc-ovr b { background: linear-gradient(180deg, #fff7cc, #ffc533 60%, #b8860b); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 .8cqw 0 #0009) }
.tc.legendary .tc-ovr::before { content: ""; width: 12cqw; height: 6cqw; margin-bottom: .6cqw; background: linear-gradient(180deg, #fff1a8, #e0a800); clip-path: polygon(0 100%, 0 20%, 25% 60%, 50% 0, 75% 60%, 100% 20%, 100% 100%) }
@container (max-width: 120px) { .tc-tier { font-size: 8.5cqw; padding: 1.4cqw 4cqw; bottom: -6cqw } .tc-plate { padding-bottom: 5cqw } }
.slot .lab { bottom: auto !important; top: -13px }
.tiers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px }
.tiers > div { display: flex; flex-direction: column; gap: 6px }
.tiers .meta { font-size: 12px; color: var(--dim); line-height: 1.35 }
.tiers .meta b { color: var(--chalk) }
.chase { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; align-items: end }
.chase > div { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; font-size: 11px; color: var(--dim) }
.chase b { font-family: var(--f-num); font-weight: 400; font-size: 13px }
.chase > div:nth-child(1) { transform: scale(.86) } .chase > div:nth-child(2) { transform: scale(.92) } .chase > div:nth-child(3) { transform: scale(.98) } .chase > div:nth-child(4) { transform: scale(1.06) }
/* shards + division */
.earn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
.earn > div { background: var(--locker-2); border-radius: 12px; padding: 9px 10px; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; line-height: 1.3 }
.earn .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: #e046ff22; color: var(--epic); font-family: var(--f-num); font-size: 11px }
.earn b { display: block; color: var(--chalk); font-size: 12.5px }
.shardbig { display: flex; align-items: center; gap: 10px }
.shardbig .ico { width: 34px; height: 34px }
.shardbig b { font-family: var(--f-num); font-weight: 400; font-size: 30px; color: #f5b3ff; line-height: 1 }
.chips2 { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none }
.chips2 button { flex: none; padding: 7px 12px; border-radius: 999px; background: var(--locker); border: 1px solid var(--seam); font-size: 12px; font-weight: 700 }
.chips2 button.on { background: var(--ball); color: var(--ball-ink); border-color: var(--ball) }
.goal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center }
.goal .track { grid-column: 1 / -1; position: relative; height: 12px; border-radius: 6px; background: var(--locker-2) }
.goal .track i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: linear-gradient(90deg, var(--ball), var(--led)) }
.goal .track em { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--win); border-radius: 2px }
.goal .track span { position: absolute; top: 16px; transform: translateX(-50%); font-size: 10px; color: var(--win); white-space: nowrap }
.divlist { display: flex; flex-direction: column; gap: 4px }
.divlist > div { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 10px; font-size: 12.5px }
.divlist > div.me { background: #ff7a1a22; box-shadow: inset 0 0 0 1px var(--ball) }
.divlist .dn { font-family: var(--f-num); font-size: 14px; color: var(--dim); text-align: center } .divlist .me .dn { color: var(--ball) }
.boostgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 8px }

/* win moment + battlefield-style rewards */
.bigwin { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; overflow: hidden;
  background: radial-gradient(circle at 50% 42%, #5a3a08 0%, #1a0f04 55%, #050302 100%); padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left, 0px)); cursor: pointer; transition: opacity .45s, transform .45s }
.bigwin.out { opacity: 0; transform: scale(1.15) }
.bw-rays { position: absolute; left: 50%; top: 42%; width: 240vmax; height: 240vmax; transform: translate(-50%, -50%); background: repeating-conic-gradient(#ffc53333 0 7deg, transparent 7deg 18deg); -webkit-mask-image: radial-gradient(circle, #000 0, transparent 42%); mask-image: radial-gradient(circle, #000 0, transparent 42%); animation: rot 16s linear infinite; pointer-events: none }
.bw-tier { position: relative; font-family: var(--f-num); font-size: 44px; line-height: 1; background: linear-gradient(180deg, #fff7cc, #ffc533 50%, #e07a00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #5a2a00) drop-shadow(0 0 24px #ffb000aa); animation: tierin .7s cubic-bezier(.3,1.6,.5,1) both }
.bw-tier.mega { background: linear-gradient(90deg, #fff7cc, #ffc533, #ff5ea8, #8b5cf6, #22d3ee, #ffc533); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; animation: tierin .7s cubic-bezier(.3,1.6,.5,1) both, mega 2s linear infinite }
@keyframes mega { to { background-position: 300% 0 } }
@keyframes tierin { 0% { transform: scale(3) rotate(-8deg); opacity: 0 } 60% { transform: scale(.92) rotate(-2deg); opacity: 1 } 100% { transform: scale(1) rotate(-3deg) } }
.bw-amt { position: relative; font-family: var(--f-num); font-size: clamp(54px, 17vw, 84px); line-height: 1; color: #fff8dc; text-shadow: 0 0 18px #ffc533, 0 0 50px #ff9a00, 0 6px 0 #6b3d00; font-variant-numeric: tabular-nums; animation: amtpulse .9s ease-in-out infinite alternate }
@keyframes amtpulse { to { text-shadow: 0 0 28px #ffd84d, 0 0 80px #ffae00, 0 6px 0 #6b3d00 } }
.bw-amt.land { animation: land .5s cubic-bezier(.3,1.8,.5,1) }
@keyframes land { 40% { transform: scale(1.25) } }
.bw-sub { position: relative; color: #f3dfb0; font-size: 15px }
.bw-sub b { color: #fff } .bw-tap { position: relative; margin-top: 18px; font-size: 13px; color: #c9b38a; animation: pulse2 1.4s ease-in-out infinite }
@keyframes pulse2 { 50% { opacity: .4 } }
.bw-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none }
.bw-flash.go { animation: flash .5s ease-out }

.mhero { position: relative; width: 100%; overflow: hidden; border-radius: 22px; padding: 18px 16px 16px; text-align: center; background: radial-gradient(circle at 50% 0%, #ffc53355, transparent 65%), linear-gradient(180deg, #3a2608, #1e1306); border: 1px solid #ffc53388; box-shadow: 0 0 40px #ffb00033, inset 0 0 30px #ffc53322 }
.mhero::before { content: ""; position: absolute; left: 50%; top: 30%; width: 700px; height: 700px; transform: translate(-50%, -50%); background: repeating-conic-gradient(#ffc5331f 0 8deg, transparent 8deg 20deg); animation: rot 24s linear infinite; pointer-events: none }
.mhero > * { position: relative }
.mhero .lbl { font-size: 13px; color: #f3dfb0; font-weight: 700 }
.mhero .amt { font-family: var(--f-num); font-size: clamp(46px, 14vw, 64px); line-height: 1.05; color: #fff8dc; text-shadow: 0 0 16px #ffc533, 0 0 40px #ff9a00aa, 0 4px 0 #6b3d00 }
.mhero .amt::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, #ffffff66 50%, transparent 65%) -150% 0 / 250% 100% no-repeat; animation: sheen 2.6s ease-in-out infinite; mix-blend-mode: overlay; pointer-events: none }
.mhero .sub { font-size: 13px; color: #e8d3a5; margin-top: 4px }
.mhero .chipsx { display: flex; justify-content: center; gap: 6px; margin-top: 10px; flex-wrap: wrap }
.mhero .chipsx span { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #00000055; color: #ffe08a; border: 1px solid #ffc53355 }
.vrow { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100% }
.vrow .verdict { font-size: 30px }
.vrow .score { font-size: 28px }
.rwlist { display: flex; flex-direction: column; gap: 8px; width: 100% }
.rwrow { --rc: var(--ball); position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; height: 58px; padding: 0 18px 0 6px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--rc) 38%, #0b0705) 0%, #170f0a 70%); clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); border-left: 4px solid var(--rc); opacity: 0; transform: translateX(110%) }
.rwrow.in { animation: rwin .45s cubic-bezier(.2,.9,.25,1.15) forwards }
@keyframes rwin { 0% { opacity: 0; transform: translateX(110%) skewX(-12deg) } 70% { opacity: 1; transform: translateX(-3%) skewX(3deg) } 100% { opacity: 1; transform: none } }
.rwrow::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, #ffffff40 48%, transparent 60%) -150% 0 / 250% 100% no-repeat; pointer-events: none }
.rwrow.in::after { animation: sheen 1s .35s ease-out forwards }
.rwrow .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: #00000055; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rc) 60%, transparent) }
.rwrow .ic svg { width: 28px; height: 28px }
.rwrow .lb { display: flex; flex-direction: column; text-align: left; min-width: 0 }
.rwrow .lb b { font-family: var(--f-num); font-weight: 400; font-size: 14px; letter-spacing: .5px; color: #fff }
.rwrow .lb span { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.rwrow .v { font-family: var(--f-num); font-size: 26px; color: var(--rc); text-shadow: 0 0 14px color-mix(in srgb, var(--rc) 60%, transparent); font-variant-numeric: tabular-nums; text-align: right }
.rwrow.coin { --rc: #ffc533 } .rwrow.xp { --rc: #38bdf8 } .rwrow.shard { --rc: #e046ff } .rwrow.lp { --rc: #3ddc84 } .rwrow.lvup { --rc: #ff7a1a; height: 64px }
.xpbar { grid-column: 2 / -1; height: 5px; border-radius: 3px; background: #ffffff1a; overflow: hidden; margin-top: -10px; align-self: start }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #38bdf8, #a5f3fc); transition: width 1s cubic-bezier(.3,.9,.3,1) }
.money.lost { opacity: .75 }
.money .line .wl { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 5px; margin-left: 6px }
.wl.w { background: #3ddc8433; color: var(--win) } .wl.l { background: #ffffff10; color: var(--faint) }

/* recycle station */
.recy { background: linear-gradient(160deg, #2a1236, #1a0f18); border: 1px solid #e046ff55; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 30px #e046ff14 }
.recy-cards { display: flex; gap: 6px; min-height: 64px; align-items: flex-end; overflow: hidden }
.recy-cards .rc { width: 46px; flex: none; position: relative; transition: transform .2s }
.recy-cards .rc .tc-tier { display: none }
.recy-cards .more { flex: none; width: 46px; height: 64px; border-radius: 6px; border: 1px dashed #e046ff88; display: grid; place-items: center; color: #f5b3ff; font-family: var(--f-num); font-size: 12px }
.recy-cards .rc.crush { animation: crush .42s ease-in forwards }
@keyframes crush { 0% { transform: none } 30% { transform: scale(1.18) rotate(-6deg); filter: brightness(1.6) } 60% { transform: scale(1.1) rotate(5deg); filter: brightness(2.2) hue-rotate(40deg) } 100% { transform: scale(0) rotate(30deg); opacity: 0; filter: brightness(3) } }
.recy .tog { display: flex; gap: 6px; flex-wrap: wrap }
.recy .tog button { padding: 6px 10px; border-radius: 999px; border: 1px solid #e046ff55; font-size: 12px; font-weight: 700; color: #f5b3ff; background: transparent }
.recy .tog button.on { background: #e046ff; color: #fff; border-color: #e046ff }
.recy .tog button:disabled { opacity: .35 }
.recy-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 15px; color: #fff; background: linear-gradient(110deg, #a21caf, #e046ff 50%, #7c3aed); box-shadow: 0 4px 0 #581c87, 0 10px 24px #e046ff44; transition: transform .08s }
.recy-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #581c87 }
.recy-btn:disabled { filter: grayscale(.7) brightness(.7); box-shadow: none }
.recy-btn svg { width: 18px; height: 18px }
.dupbadge { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); z-index: 7; background: #e046ff; color: #fff; font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 6px; white-space: nowrap; box-shadow: 0 2px 6px #0008 }
.flyshard { position: fixed; left: 0; top: 0; z-index: 81; width: 20px; height: 20px; pointer-events: none; filter: drop-shadow(0 0 6px #e046ff) }
.hud-pulse { animation: hudp .5s ease-out }
@keyframes hudp { 30% { transform: scale(1.35); box-shadow: 0 0 0 4px #e046ff66, 0 0 24px #e046ff } }

/* ---- forge (shards minigame) ---- */
.forge-hd { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 20px; background: radial-gradient(120% 120% at 0% 0%, #e046ff33, transparent 60%), linear-gradient(160deg, #2a1640, #160c22); border: 1px solid #e046ff44 }
.jar { position: relative; width: 78px; height: 92px; flex: none }
.jar svg { width: 100%; height: 100% }
.jar b { position: absolute; left: 0; right: 0; top: 44%; text-align: center; font-family: var(--f-num); font-weight: 400; font-size: 20px; color: #fff; text-shadow: 0 2px 6px #000 }
.jar .fill { transition: y .8s cubic-bezier(.2, .8, .2, 1), height .8s cubic-bezier(.2, .8, .2, 1) }
.jar.bump { animation: jarbump .35s } @keyframes jarbump { 40% { transform: scale(1.12) rotate(-3deg) } }
.forge-hd h2 { margin: 0; font-size: 18px } .forge-hd p { margin: 3px 0 0; font-size: 12px; color: #e8ccff }
.fgoal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--locker); border: 1px solid var(--seam); font-size: 12.5px }
.fgoal .pips { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px } .fgoal .pips i { height: 6px; border-radius: 3px; background: var(--locker-2) } .fgoal .pips i.f { background: #e046ff; box-shadow: 0 0 8px #e046ff99 }
.crusher { position: relative; height: 230px; border-radius: 22px; overflow: hidden; background: radial-gradient(80% 60% at 50% 100%, #e046ff55, transparent 70%), repeating-linear-gradient(90deg, #1c1226 0 18px, #20152b 18px 20px); border: 1px solid #e046ff33; display: grid; place-items: center }
.crusher .jaw { position: absolute; left: 6%; right: 6%; height: 26px; border-radius: 8px; background: repeating-linear-gradient(90deg, #4a3a5a 0 10px, #3a2c48 10px 20px); box-shadow: 0 4px 12px #000a; transition: transform .12s }
.crusher .jaw.t { top: 10px } .crusher .jaw.b { bottom: 10px }
.crusher.press .jaw.t { transform: translateY(calc(var(--k, 0) * 70px)) } .crusher.press .jaw.b { transform: translateY(calc(var(--k, 0) * -70px)) }
.crusher .incard { width: 104px; transition: transform .25s cubic-bezier(.2, .9, .3, 1.3) }
.crusher .incard.drop { animation: indrop .35s cubic-bezier(.2, .9, .3, 1.3) } @keyframes indrop { from { transform: translateY(-160px) rotate(-12deg) scale(.6); opacity: 0 } }
.crusher .incard.smash { animation: smash .32s ease-in forwards } @keyframes smash { to { transform: scaleY(.05) scaleX(1.3); opacity: 0; filter: brightness(3) } }
.crusher .empty { color: #cfb3e6; font-size: 13px; text-align: center; max-width: 220px }
.crusher.shake { animation: cshake .3s }
.combo { position: absolute; top: 46px; right: 14px; font-family: var(--f-num); font-size: 22px; color: #ffd23f; text-shadow: 0 2px 8px #000; opacity: 0; transform: scale(.6) }
.combo.on { animation: comboin .5s cubic-bezier(.2, .9, .3, 1.4) forwards } @keyframes comboin { to { opacity: 1; transform: scale(1) } }
.holdbtn { display: grid; place-items: center; text-align: center; position: relative; width: 100%; height: 62px; border-radius: 18px; overflow: hidden; background: #e046ff; color: #fff; font-weight: 900; font-size: 17px; letter-spacing: .02em; user-select: none; -webkit-user-select: none; touch-action: none; box-shadow: 0 6px 0 #7a1f99, 0 10px 24px #e046ff55 }
.holdbtn:disabled { background: var(--locker-2); color: var(--dim); box-shadow: none }
.holdbtn .fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #ffd23f, #fff3c4); mix-blend-mode: overlay }
.holdbtn span { position: relative } .holdbtn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 3px 0 #7a1f99 }
.rstrip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none } .rstrip::-webkit-scrollbar { display: none }
.rstrip button { flex: none; width: 74px; position: relative } .rstrip button.sel { transform: translateY(-6px) } .rstrip button.sel::after { content: ""; position: absolute; inset: -4px; border-radius: 10px; border: 2px solid #e046ff }
.rstrip .v { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 6px; background: #e046ff; color: #fff; white-space: nowrap; z-index: 3 }
.uplist { display: grid; gap: 8px }
.uprow { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 14px; background: var(--locker); border: 1px solid var(--seam); text-align: left }
.uprow b { font-size: 14px } .uprow .m { font-size: 11.5px; color: var(--dim) } .uprow .m em { font-style: normal; color: var(--win); font-weight: 800 }
.uprow .c { display: flex; gap: 4px; align-items: center; font-weight: 900; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: #3b1250; border: 1.5px solid #e046ff; color: #fff }
.uprow .c.no { background: var(--locker-2); color: var(--dim) }
.anvil { position: relative; display: grid; justify-items: center; gap: 10px; padding: 14px 10px 10px; border-radius: 22px; background: radial-gradient(70% 50% at 50% 85%, #ff7a1a44, transparent 70%), linear-gradient(180deg, #24170f, #120b07); border: 1px solid #ff7a1a33; overflow: hidden }
.anvil .tc { width: 150px }
.anvil .ablock { width: 190px; height: 34px; margin-top: -16px; border-radius: 8px 8px 20px 20px; background: linear-gradient(180deg, #6b6f78, #33363c); box-shadow: 0 8px 18px #000a; position: relative; z-index: 0 }
.anvil .hammer { position: absolute; right: 18%; top: 14px; width: 70px; height: 70px; transform-origin: 85% 85%; transform: rotate(35deg); transition: transform .08s; z-index: 4 }
.anvil .hammer.hit { animation: hammer .26s ease-in } @keyframes hammer { 0% { transform: rotate(35deg) } 45% { transform: rotate(-38deg) } 100% { transform: rotate(35deg) } }
.anvil .tc.ring { animation: ringhit .25s } @keyframes ringhit { 40% { transform: scale(.96) translateY(3px); filter: brightness(1.6) } }
.lvpips { display: flex; gap: 5px } .lvpips i { width: 18px; height: 6px; border-radius: 3px; background: #ffffff1c } .lvpips i.f { background: var(--ball) } .lvpips i.n { background: #ffd23f; box-shadow: 0 0 8px #ffd23f; animation: albPulse 1.2s infinite }
.timing { position: relative; width: 100%; max-width: 320px; height: 34px; border-radius: 12px; background: linear-gradient(90deg, #3a2618, #2a1a10); border: 1px solid #ffffff22; overflow: hidden }
.timing .zone { position: absolute; left: 40%; width: 20%; top: 0; bottom: 0; background: linear-gradient(90deg, transparent, #ffd23f66 20%, #ffd23f88 50%, #ffd23f66 80%, transparent); border-left: 1px solid #ffd23f; border-right: 1px solid #ffd23f }
.timing .needle { position: absolute; top: 3px; bottom: 3px; width: 5px; margin-left: -2px; border-radius: 3px; background: #fff; box-shadow: 0 0 10px #fff; animation: needle 1.15s ease-in-out infinite alternate }
@keyframes needle { from { left: 3% } to { left: 97% } }
.strikes { display: flex; gap: 8px } .strikes i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffffff33; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 900 } .strikes i.f { background: var(--ball); border-color: var(--ball); color: var(--ball-ink) } .strikes i.p { background: #ffd23f; border-color: #ffd23f; color: #3a2600 }
.strikebtn { width: 100%; max-width: 320px; height: 58px; border-radius: 18px; background: var(--ball); color: var(--ball-ink); font-family: var(--f-num); font-size: 20px; box-shadow: 0 6px 0 #a3470a, 0 10px 24px #ff7a1a55 }
.strikebtn:active { transform: translateY(3px); box-shadow: 0 3px 0 #a3470a }
.statroll { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 320px; text-align: center }
.statroll div { background: #0005; border-radius: 10px; padding: 6px 0; font-size: 9.5px; font-weight: 800; color: var(--dim) } .statroll b { display: block; font-family: var(--f-num); font-weight: 400; font-size: 18px; color: var(--chalk) } .statroll b.up { color: var(--win); animation: popup .5s }
@keyframes popup { 40% { transform: scale(1.4) } }
.fpop { position: absolute; z-index: 9; font-family: var(--f-num); font-size: 20px; color: #ffd23f; text-shadow: 0 2px 8px #000; pointer-events: none; animation: fpop 1s ease-out forwards } @keyframes fpop { to { transform: translateY(-60px); opacity: 0 } }
.forgecard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px; border-radius: 20px; background: radial-gradient(120% 120% at 0% 0%, #e046ff33, transparent 60%), linear-gradient(160deg, #2a1640, #160c22); border: 1px solid #e046ff44 }
.forgecard .jar { width: 60px; height: 72px }
.recgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px }
.rc2 { position: relative } .rc2 .v { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); z-index: 3; font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 7px; background: #e046ff; color: #fff; white-space: nowrap }
.rc2.crush2 { animation: crush2 .45s ease-in forwards } @keyframes crush2 { 40% { transform: scale(1.12) rotate(-4deg); filter: brightness(1.8) } 100% { transform: scale(0) rotate(12deg); opacity: 0 } }
.empty2 { display: grid; justify-items: center; gap: 6px; padding: 30px 10px; color: var(--dim); text-align: center } .empty2 b { color: var(--chalk) }
.uprow.focus { border-color: #e046ff; box-shadow: 0 0 0 2px #e046ff44 }
.uprow.justup .tc { animation: stamp .55s cubic-bezier(.2, .9, .3, 1.4) } .uprow.justup { border-color: var(--win) }
.uprow .c.coin { background: var(--ball); color: var(--ball-ink) } .forgecard .jar b { font-size: 16px }
.forgecard .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px } .forgecard .acts span { font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: #ffffff14 } .forgecard .acts span.hot { background: #e046ff; color: #fff }
/* ---- albums (sticker book) ---- */
.binders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.binder { position: relative; aspect-ratio: .78; border-radius: 6px 16px 16px 6px; padding: 10px 10px 10px 16px; overflow: hidden; text-align: left; display: grid; grid-template-rows: auto 1fr auto; background: linear-gradient(150deg, var(--b1), color-mix(in srgb, var(--b1) 55%, #000)); box-shadow: inset 6px 0 0 #0005, inset 8px 0 0 #ffffff14, 0 8px 18px #0008 }
.binder::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, #ffffff22 45%, transparent 60%); pointer-events: none }
.binder .bn { font-weight: 900; font-size: 13px; line-height: 1.1; color: var(--bk); text-shadow: 0 1px 2px #0006 }
.binder .bc { display: grid; place-items: center } .binder .bc svg { width: 56%; height: auto; filter: drop-shadow(0 4px 8px #0008) }
.binder .bp { display: grid; gap: 4px } .binder .dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px } .binder .dots i { height: 6px; border-radius: 2px; background: #0006 } .binder .dots i.f { background: #fff } .binder .dots i.u { background: #ffd23f; animation: albPulse 1.2s infinite }
.binder .ct { font-family: var(--f-num); font-size: 12px; color: var(--bk) }
.binder .flag2 { position: absolute; bottom: 38px; right: 8px; font-size: 9.5px; font-weight: 900; padding: 3px 7px; border-radius: 7px; background: #ffd23f; color: #3a2600; z-index: 2 }
.binder.done { box-shadow: inset 6px 0 0 #0005, 0 0 0 2px #ffc533, 0 8px 22px #ffc53355 }
.binder.done::after { content: "COMPLETE"; position: absolute; left: -26px; top: 18px; transform: rotate(-35deg); background: #ffc533; color: #3a2600; font-size: 9px; font-weight: 900; padding: 3px 30px; letter-spacing: .08em }
.collhero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 20px; background: radial-gradient(120% 120% at 100% 0%, #ffc53333, transparent 60%), linear-gradient(160deg, #2a1d10, #140e08); border: 1px solid #ffc53344 }
.ring { position: relative; width: 84px; height: 84px } .ring svg { width: 100%; height: 100%; transform: rotate(-90deg) } .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-num); font-weight: 400; font-size: 18px; line-height: 1 } .ring b small { display: block; font-family: var(--f-ui); font-size: 9px; font-weight: 800; color: var(--dim) }
.mstrack { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none } .mstrack::-webkit-scrollbar { display: none }
.ms { flex: none; width: 74px; display: grid; justify-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; background: var(--locker); border: 1px solid var(--seam); font-size: 10.5px; text-align: center }
.ms b { font-family: var(--f-num); font-weight: 400; font-size: 14px } .ms.got { opacity: .55 } .ms.can { border-color: var(--legend); box-shadow: 0 0 0 2px #ffc53333; animation: albPulse 1.4s infinite } .ms .ri { width: 26px; height: 26px; display: grid; place-items: center } .ms .ri svg { width: 20px; height: 20px }
.tray { position: sticky; bottom: 10px; z-index: 5; display: grid; gap: 8px; padding: 10px; border-radius: 18px; background: #1a120bee; border: 1px solid #ffd23f66; box-shadow: 0 -6px 24px #000a; backdrop-filter: blur(6px) }
.tray .tl { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none } .tray .tl::-webkit-scrollbar { display: none }
.tray .tl button { flex: none; width: 64px; position: relative; animation: wiggle 2.4s ease-in-out infinite } .tray .tl button:nth-child(2n) { animation-delay: .4s }
@keyframes wiggle { 0%, 100% { transform: rotate(0) } 10% { transform: rotate(-4deg) } 20% { transform: rotate(3deg) } 30% { transform: rotate(0) } }

.signed { display: grid; justify-items: center; gap: 10px; text-align: center }
.signed .tc { width: min(220px, 60vw) }
.shortfall { display: grid; gap: 8px } .shortfall .bundle { flex-direction: row; justify-content: space-between; width: 100%; text-align: left }
.upbuy { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 12px; background: var(--ball); color: var(--ball-ink); font-weight: 900; font-size: 14px }
.rwrow.pass .ic svg { width: 26px; height: 26px }
.rwrow.pass { --rc: #a78bfa }
.rwrow .passbar2 { grid-column: 2 / -1; height: 5px; border-radius: 3px; background: #ffffff1a; overflow: hidden; margin-top: -10px; align-self: start } .rwrow .passbar2 i { display: block; height: 100%; background: linear-gradient(90deg, #a78bfa, #ffc533); transition: width .8s }

/* match: controls, backed player, paused labels, hints */
.bcard[hidden], .ptip[hidden], .pausepill[hidden] { display: none }
.mbtn { width: 32px; height: 32px; border-radius: 50%; background: var(--locker); border: 1px solid var(--seam); display: grid; place-items: center; font-weight: 900; font-size: 14px; color: var(--chalk) }
.mbtn svg { width: 16px; height: 16px }
.controls { display: flex; gap: 6px; align-items: center; justify-content: space-between }
.controls .speeds { display: flex; gap: 3px; flex: 1; justify-content: center; background: var(--locker); border: 1px solid var(--seam); border-radius: 12px; padding: 3px }
.controls .speeds button { flex: 1 1 0; border: 0; background: none; border-radius: 9px; padding: 0; height: 34px; min-width: 0; display: grid; place-items: center; text-align: center; font-family: var(--f-num); font-size: 12.5px; line-height: 1; white-space: nowrap; letter-spacing: 0 }
.controls .speeds button.on { background: var(--chalk); color: #1a120b }
.controls .pbtn { flex: none; width: 44px; height: 42px; padding: 0; display: grid; place-items: center; border-radius: 12px; background: var(--ball); color: var(--ball-ink); border: 0 }
.controls .pbtn.on { background: var(--win); color: #062b16 }
.controls #skipq { flex: none; height: 42px; padding: 0 12px; display: grid; place-items: center }
.controls .speeds { height: 42px; align-items: center; box-sizing: border-box }
.pdot .bring { display: none; position: absolute; inset: -7px; border-radius: 50%; border: 3px solid #ffd23f; box-shadow: 0 0 14px 3px #ffd23faa; animation: bring 1.1s ease-in-out infinite; pointer-events: none }
.pdot .btag { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: #ffd23f; color: #1a120b; font-family: var(--f-ui); font-weight: 900; font-size: 10px; letter-spacing: .03em; padding: 2px 6px; border-radius: 6px; box-shadow: 0 2px 6px #0008; text-transform: uppercase }
.pdot.backed { z-index: 7 } .pdot.backed .bring, .pdot.backed .btag { display: block }
@keyframes bring { 50% { transform: scale(1.12); box-shadow: 0 0 22px 6px #ffd23fcc } }
.lcourt.paused .pdot::after { content: attr(data-n); position: absolute; top: calc(100% + 3px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-ui); font-size: 9.5px; font-weight: 800; color: #fff; background: #000b; padding: 1px 5px; border-radius: 5px; pointer-events: none }
.lcourt.paused .pdot { cursor: pointer }
.lcourt.paused .ballx, .lcourt.paused .shadow { opacity: .85 }
.pausepill { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 9; background: #000c; color: #fff; border: 1px solid #fff5; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 800; white-space: nowrap }
.ptip { position: absolute; z-index: 10; transform: translate(-50%, -100%); min-width: 150px; max-width: 70%; background: var(--paper, #f4ecdf); color: #1a120b; border-radius: 12px; padding: 8px 10px; box-shadow: 0 8px 20px #000a; display: grid; gap: 1px; font-size: 11.5px; pointer-events: none }
.ptip.below { transform: translate(-50%, 0) } .ptip b { font-size: 13px } .ptip .n { font-weight: 900; margin-top: 2px }
.bcard { position: absolute; top: 8px; left: 8px; z-index: 9; min-width: 128px; max-width: 54%; background: #120c08e8; border: 1.5px solid #ffd23f; border-radius: 12px; padding: 7px 9px; box-shadow: 0 6px 16px #000a; display: grid; gap: 5px; pointer-events: none }
.bcard .bc-top { display: flex; align-items: baseline; gap: 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .02em }
.bcard .bc-n { font-family: var(--f-num); color: #ffd23f; font-size: 12px }
.bcard .bc-st { display: flex; gap: 12px } .bcard .bc-st span { font-size: 9.5px; color: var(--dim); font-weight: 800; letter-spacing: .06em }
.bcard .bc-st b { display: block; font-family: var(--f-num); font-weight: 400; font-size: 20px; color: var(--chalk); line-height: 1; letter-spacing: 0 }
.bc-bet { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; font-size: 11px; padding-top: 5px; border-top: 1px solid #ffffff1f }
.bc-bet b { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--locker-2) } .bc-bet em { grid-column: 1 / -1; font-style: normal; color: var(--dim); font-size: 10.5px }
.bc-bet.good b, .bc-bet.won b { background: var(--win); color: #062b16 } .bc-bet.bad b, .bc-bet.lost b { background: var(--loss); color: #fff } .bc-bet.mid b { background: #ffd23f; color: #1a120b }
.tapsnd { position: absolute; right: 8px; top: 8px; z-index: 9; display: flex; align-items: center; gap: 5px; background: #000c; color: #fff; border: 1px solid #fff6; border-radius: 999px; padding: 5px 10px 5px 8px; font-size: 11.5px; font-weight: 800 }
.tapsnd svg { width: 14px; height: 14px }
.hintb { position: fixed; left: 50%; bottom: calc(var(--tab-h, 64px) + 14px); transform: translateX(-50%); z-index: 9999; width: min(360px, calc(100vw - 32px)); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; background: #f4ecdf; color: #1a120b; border-radius: 16px; padding: 11px 12px; box-shadow: 0 12px 30px #000c, 0 0 0 2px #ff7a1a; font-size: 13px; line-height: 1.35; animation: hintin .3s cubic-bezier(.2, .9, .3, 1.3) both }
.hintb .hi { width: 26px; height: 26px; border-radius: 50%; background: var(--ball); color: var(--ball-ink); display: grid; place-items: center; font-weight: 900; font-family: Georgia, serif; font-style: italic }
.hintb .hx { background: #1a120b; color: #f4ecdf; border-radius: 10px; padding: 8px 10px; font-size: 12px; font-weight: 800; white-space: nowrap }
.hintb.out { animation: hintout .25s ease both }
@keyframes hintin { from { opacity: 0; transform: translate(-50%, 12px) scale(.96) } } @keyframes hintout { to { opacity: 0; transform: translate(-50%, 8px) } }
.full .hintb { bottom: 16px }

/* albums */
.alb-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.alb-sum > div { background: var(--locker); border: 1px solid var(--seam); border-radius: 14px; padding: 10px 12px; font-size: 11.5px; color: var(--dim) }
.alb-sum b { display: block; font-family: var(--f-num); font-weight: 400; color: var(--chalk); font-size: 22px }
.alb-perk { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; background: linear-gradient(135deg, #3a2a0a, #241a10); border: 1px solid #6b4f12; border-radius: 14px; padding: 12px; font-size: 12.5px; color: var(--chalk) }
.alb-perk .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--legend); color: #3a2600; display: grid; place-items: center; font-weight: 900; font-size: 15px }
.alb-perk p { margin: 2px 0 0; color: var(--dim); font-size: 11.5px }
.alb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
.alb-t { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: center; padding: 10px; border-radius: 14px; background: var(--locker); border: 1px solid var(--seam); text-align: left; overflow: hidden }
.alb-t .nm { font-weight: 800; font-size: 12.5px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.alb-t .bar { height: 5px; border-radius: 3px; background: var(--locker-2); margin-top: 5px; overflow: hidden }
.alb-t .bar i { display: block; height: 100%; background: var(--ball); border-radius: 3px }
.alb-t .ct { font-size: 11px; color: var(--dim); margin-top: 3px; font-family: var(--f-num) }
.alb-t.done { border-color: #c9a227; background: linear-gradient(135deg, #3a2a0a, var(--locker)) }
.alb-t.done .bar i { background: var(--legend) }
.alb-t.claim { border-color: var(--legend); box-shadow: 0 0 0 2px #ffc53344, 0 0 18px #ffc53355; animation: albPulse 1.6s ease-in-out infinite }
@keyframes albPulse { 50% { box-shadow: 0 0 0 3px #ffc53366, 0 0 26px #ffc53388 } }
.alb-t .flag { position: absolute; top: 7px; right: 8px; font-size: 9.5px; font-weight: 900; letter-spacing: .04em; padding: 2px 6px; border-radius: 6px; background: var(--legend); color: #3a2600 }
.alb-conf { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none }
.alb-conf button { flex: none; padding: 8px 12px; border-radius: 999px; background: var(--locker-2); border: 1px solid var(--seam); font-weight: 800; font-size: 12px; white-space: nowrap }
.alb-conf button.on { background: var(--chalk); color: #1a120b }
.alb-conf button span { font-family: var(--f-num); font-weight: 400; margin-left: 4px; opacity: .7 }
.alb-book { background: linear-gradient(180deg, #2a1d12, #1a120b); border: 1px solid var(--seam); border-radius: 18px; padding: 12px; box-shadow: inset 0 0 0 4px #00000033 }
.alb-hdr { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center }
.alb-hdr h2 { margin: 0; font-size: 19px; line-height: 1.1 }
.alb-fl { width: 16px; height: 11px; vertical-align: -1px; border-radius: 2px; margin-right: 2px }
.alb-hdr p { margin: 3px 0 0; font-size: 11.5px; color: var(--dim) }
.alb-row { margin-top: 12px }
.alb-row > span { display: block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 800; margin-bottom: 6px }
.alb-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px }
.alb-cards > button { padding: 0; min-width: 0 }
.alb-miss { position: relative; width: 100%; aspect-ratio: 5 / 7; border-radius: 6%/4.3%; border: 1.5px dashed #ffffff2e; background: repeating-linear-gradient(135deg, #ffffff06 0 6px, transparent 6px 12px), #0b0705; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; container-type: inline-size; color: var(--faint); text-align: center }
.alb-miss .num { font-family: Bungee, var(--f-num); font-size: 30cqw; line-height: 1; color: #ffffff22 }
.alb-miss .ps { font-size: 13cqw; font-weight: 900; color: var(--dim) }
.alb-miss .nm { font-size: 10.5cqw; line-height: 1.15; padding: 0 6%; color: var(--dim); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.alb-miss .tr { position: absolute; bottom: 5%; font-size: 9cqw; font-weight: 900; letter-spacing: .05em }
.alb-ghost { position: relative }
.alb-ghost .tc { filter: saturate(.35) brightness(.75) }
.alb-rec { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg); z-index: 4; white-space: nowrap; font-size: 9.5px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; background: #1a120bdd; color: var(--chalk); border: 1px solid #ffffff55 }
.alb-prog { display: flex; align-items: center; gap: 10px; margin-top: 12px }
.alb-prog .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--locker-2); overflow: hidden }
.alb-prog .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ball), var(--legend)); border-radius: 4px; transition: width .6s cubic-bezier(.2, .8, .2, 1) }
.alb-prog b { font-family: var(--f-num); font-weight: 400; font-size: 16px }
.alb-stamp { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--legend); color: #3a2600; font-weight: 900; font-size: 12px; transform: rotate(-3deg) }
/* division odds */
.divodds { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--seam); background: var(--locker); font-size: 12.5px }
.divodds .md { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 11px; color: #1a120b }
.divodds p { margin: 2px 0 0; color: var(--dim); font-size: 11.5px }
.divodds p b { color: var(--win) }
.bandtbl { display: grid; gap: 6px }
.bandtbl > div { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--locker); border: 1px solid var(--seam); font-size: 12.5px }
.bandtbl > div.me { border-color: var(--ball); box-shadow: 0 0 0 2px #ff7a1a33 }
.bandtbl .md { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 9.5px; font-weight: 900; color: #1a120b }
.bandtbl .o { font-family: var(--f-num); color: var(--ball) }
.bandtbl .r { font-family: var(--f-num); color: var(--win); min-width: 44px; text-align: right }

/* sportsbook bet slip */
.slip { background: var(--locker); border: 1px solid var(--seam); border-radius: 16px; overflow: hidden; box-shadow: 0 -8px 24px #0009 }
.slip-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 12px; text-align: left }
.slip-head .cnt { min-width: 22px; height: 22px; border-radius: 11px; background: var(--ball); color: var(--ball-ink); font-weight: 800; font-size: 12px; display: grid; place-items: center; padding: 0 6px }
.slip-head svg { transition: transform .2s; flex: none } .slip.open .slip-head svg { transform: rotate(180deg) }
.slip-body { max-height: 44vh; overflow-y: auto; border-top: 1px solid var(--seam); padding: 0 12px; overscroll-behavior: contain }
.slip-row { padding: 10px 0; border-bottom: 1px solid var(--seam); display: grid; gap: 7px }
.slip-row:last-child { border-bottom: 0 }
.sr-top { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--dim) }
.sr-x { width: 26px; height: 26px; border-radius: 50%; background: var(--locker-2); color: var(--dim); font-size: 15px; line-height: 1; display: grid; place-items: center }
.sr-sel { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; align-items: baseline }
.sr-sel .o { font-family: var(--f-num); color: var(--ball); font-size: 16px; flex: none }
.sr-stake { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center }
.inp { display: flex; align-items: center; gap: 4px; background: #0b0705; border: 1.5px solid var(--seam); border-radius: 10px; padding: 0 10px; height: 42px; min-width: 0 }
.inp:focus-within { border-color: var(--ball); box-shadow: 0 0 0 3px #ff7a1a26 }
.inp span { color: var(--dim); font-family: var(--f-num); font-size: 14px }
.inp input { width: 100%; min-width: 0; background: none; border: 0; color: var(--chalk); font-family: var(--f-num); font-size: 16px; outline: none; padding: 0 }
.inp.bad { border-color: var(--loss) }
.qs { display: flex; gap: 4px }
.qs button { text-align: center; padding: 9px 9px; border-radius: 9px; background: var(--locker-2); border: 1px solid var(--seam); font-weight: 800; font-size: 12px; white-space: nowrap }
.qs button:active { transform: scale(.94) }
.sr-ret { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim) }
.sr-ret b { color: var(--win); font-family: var(--f-num); font-weight: 400; font-size: 13px }
.slip-all { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; font-size: 12px; color: var(--dim); flex-wrap: wrap; border-top: 1px solid var(--seam) }
.slip-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--seam); font-size: 11.5px; color: var(--dim) }
.slip-sum b { display: block; color: var(--chalk); font-family: var(--f-num); font-weight: 400; font-size: 17px }
.slip-sum .r { text-align: right } .slip-sum .r b { color: var(--win) }
.slip-err { margin: 0; padding: 0 12px 10px; font-size: 12px; color: var(--loss) }
.slip-err:empty { display: none }
.slip-lim { padding: 0 12px 10px; font-size: 10.5px; color: var(--faint) }

/* result */
@keyframes drift { from { --mx: 20%; --my: 25% } to { --mx: 80%; --my: 75% } }
@property --mx { syntax: "<percentage>"; inherits: true; initial-value: 50% }
@property --my { syntax: "<percentage>"; inherits: true; initial-value: 50% }
.tc.cap .tc-flag { top: 46cqw }
.tc.cap .tc-lv { top: 60cqw }
.tc.cap .tc-ovr::after { content: "C"; width: 9cqw; height: 9cqw; border-radius: 50%; background: var(--ball); color: var(--ball-ink); font-weight: 900; font-size: 6cqw; display: grid; place-items: center; margin-top: 1.2cqw; box-shadow: 0 0 0 .8cqw #fff }
@container (max-width: 120px) {
  .tc-stats, .tc-bar, .tc-serial { display: none }
  .tc-flag { width: 22cqw; top: 31cqw; border-radius: 2cqw; outline-width: 1cqw }
  .tc-lv { top: 48cqw; font-size: 9cqw }
  .tc-last { font-size: 11cqw }
  .tc-first { font-size: 7cqw }
  .tc-plate { padding-bottom: 3.4cqw }
}
/* card back */
.tc-back { position: absolute; inset: 0; border-radius: inherit; background: var(--foil); }
.tc-back .tc-in { background: repeating-linear-gradient(45deg, #1d140e 0 3cqw, #241912 3cqw 6cqw); padding: 5cqw; display: flex; flex-direction: column; gap: 2.5cqw; color: #fff }
.tc-back h4 { margin: 0; font-family: var(--f-num); font-weight: 400; font-size: 8cqw; line-height: 1 }
.tc-back .bio { font-size: 4.6cqw; color: #ffffffb0; line-height: 1.3 }
.tc-back .sb { display: grid; grid-template-columns: 26cqw 1fr 10cqw; gap: 2cqw; align-items: center; font-size: 4.6cqw }
.tc-back .sb i { height: 2.4cqw; border-radius: 2cqw; background: #ffffff1a; overflow: hidden; display: block }
.tc-back .sb i em { display: block; height: 100%; background: var(--rc) }
.tc-back .sb b { font-family: var(--f-num); font-weight: 400; text-align: right }
.tc-back .no { margin-top: auto; display: flex; justify-content: space-between; font-size: 4.2cqw; color: #ffffff90 }
.flipper { width: 68%; max-width: 260px; margin: 0 auto; cursor: pointer; display: block; flex: none; align-self: center }
.flipper .turn { position: relative; width: 100%; aspect-ratio: 5 / 7 }
.flipper .side { position: absolute; inset: 0 }

/* ======================= PACK ======================= */
.pk { --pc: var(--rare); --pc2: #0b1d4d; position: relative; width: 100%; aspect-ratio: 0.64; max-width: 100%; container-type: inline-size; filter: drop-shadow(0 4cqw 7cqw #000c) drop-shadow(0 0 6cqw color-mix(in srgb, var(--pc) 40%, transparent)) }
.pk.base { --pc: #c7d0dc; --pc2: #1d2430 } .pk.pro { --pc: #4d8bff; --pc2: #0b1d4d } .pk.elite { --pc: #e046ff; --pc2: #2c0838 } .pk.welcome { --pc: #ffc533; --pc2: #3a2600 }
.pk-body, .pk-top { position: absolute; inset: 0; background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 35%, #000) 0%, var(--pc2) 45%, #050307 100%) }
.pk-body::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 6cqw, #ffffff0d 6cqw 7cqw), radial-gradient(circle at 50% 46%, color-mix(in srgb, var(--pc) 55%, transparent), transparent 55%) }
.pk-body::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, #ffffff40 48%, transparent 60%) -150% 0 / 250% 100% no-repeat; animation: sheen 3.6s ease-in-out infinite }
@keyframes sheen { 55%, 100% { background-position: 150% 0 } }
.pk-top { z-index: 3; background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 70%, #fff) 0%, var(--pc) 60%, color-mix(in srgb, var(--pc) 55%, #000) 100%) }
.pk-top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2cqw; height: .8cqw; background: repeating-linear-gradient(90deg, #0006 0 2cqw, transparent 2cqw 4cqw) }
.pk-ball { position: absolute; left: 50%; top: 47%; width: 52cqw; transform: translate(-50%, -50%); z-index: 1 }
.pk-ball svg { width: 100%; display: block; animation: rot 14s linear infinite; filter: drop-shadow(0 0 4cqw var(--pc)) }
@keyframes rot { to { transform: rotate(1turn) } }
.pk-word { position: absolute; left: 0; right: 0; top: 19%; text-align: center; z-index: 2; font-family: var(--f-num); font-size: 9cqw; letter-spacing: .5cqw; color: #fff; text-shadow: 0 0 3cqw var(--pc) }
.pk-tier { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; z-index: 2; font-family: var(--f-num); font-size: 15cqw; line-height: 1; background: linear-gradient(180deg, #fff, var(--pc)); -webkit-background-clip: text; background-clip: text; color: transparent }
.pk-count { position: absolute; left: 0; right: 0; bottom: 11%; text-align: center; z-index: 2; font-size: 5.5cqw; font-weight: 700; color: #ffffffb0; letter-spacing: .4cqw }
.pk-own { position: absolute; top: 3%; right: 6cqw; z-index: 4; background: var(--ball); color: var(--ball-ink); border-radius: 3cqw; font-weight: 900; font-size: 7cqw; padding: .5cqw 2.4cqw }
.bob { animation: bob 3s ease-in-out infinite }
